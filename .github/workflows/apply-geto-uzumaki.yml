name: Apply Geto Uzumaki patch

on:
  push:
    branches: [test]
    paths:
      - '.patch_geto_uzumaki.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .patch_geto_uzumaki.py
      - name: Commit patched geto.py and cleanup
        run: |
          rm -f .patch_geto_uzumaki.py .github/workflows/apply-geto-uzumaki.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geto.py .patch_geto_uzumaki.py .github/workflows/apply-geto-uzumaki.yml
          git commit -m "Implement Geto Uzumaki extraction" || exit 0
          git push origin test
