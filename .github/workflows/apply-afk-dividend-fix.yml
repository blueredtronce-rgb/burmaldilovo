name: Apply AFK and dividend production fix

on:
  push:
    branches: [agent/fix-afk-dividends]
    paths:
      - '.patch_afk_dividends.py'
      - '.github/workflows/apply-afk-dividend-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-afk-dividends
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .patch_afk_dividends.py
      - name: Validate patched scripts
        run: |
          python -m py_compile economy.py companies.py hidden.py
          grep -q 'DIVIDEND_INTERVAL_SECONDS = 3 \* 60 \* 60' companies.py
          grep -q 'каждые 3 часа' companies.py
          grep -q 'def deposit_batch_once' economy.py
          grep -q 'processed_batch_operations' economy.py
          grep -q 'SmartY_Hidden_ActiveSessions' economy.py
          grep -q 'SmartY_Hidden_ActiveSessions' hidden.py
          ! grep -q 'каждые 5 минут (тестовый режим)' companies.py
      - name: Commit fix and cleanup
        run: |
          rm -f .patch_afk_dividends.py .github/workflows/apply-afk-dividend-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add economy.py companies.py hidden.py .patch_afk_dividends.py .github/workflows/apply-afk-dividend-fix.yml
          git commit -m "Fix hidden AFK and production dividends" || exit 0
          git push origin agent/fix-afk-dividends
